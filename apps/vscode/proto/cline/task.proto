syntax = "proto3";

package cline;

import "cline/common.proto";
import "cline/state.proto";
import "cline/task_group.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service TaskService {
  // JSON payloads use shared/Walkthrough.ts; all anchors resolve on the host.
  rpc getChangeWalkthrough(StringRequest) returns (String);
  rpc generateChangeWalkthrough(StringRequest) returns (String);
  rpc openWalkthroughDiff(StringRequest) returns (Empty);
  rpc revertWalkthroughChange(StringRequest) returns (String);
  rpc sendWalkthroughNotes(StringRequest) returns (Empty);
  // Cancels the currently running task
  rpc cancelTask(EmptyRequest) returns (Empty);
  // Cancels a queued prompt by ID
  rpc cancelQueuedPrompt(StringRequest) returns (Empty);
  // Cancels the currently running background command
  rpc cancelBackgroundCommand(EmptyRequest) returns (Empty);
  // Detaches the running foreground terminal command ("Proceed While Running"):
  // the agent receives the partial output and a log file path for the rest.
  rpc proceedWhileRunningCommand(EmptyRequest) returns (Empty);
  // Clears the current task
  rpc clearTask(EmptyRequest) returns (Empty);
  // Gets the total size of all tasks
  rpc getTotalTasksSize(EmptyRequest) returns (Int64);
  // Deletes multiple tasks with the given IDs
  rpc deleteTasksWithIds(StringArrayRequest) returns (Empty);
  // Creates a new task with the given text and optional images
  rpc newTask(NewTaskRequest) returns (String);
  // Shows a task with the specified ID
  rpc showTaskWithId(StringRequest) returns (TaskResponse);
  // Opens the on-disk session directory (messages json, logs) for the task with the given ID
  rpc exportTaskWithId(StringRequest) returns (Empty);
  // Toggles the favorite status of a task
  rpc toggleTaskFavorite(TaskFavoriteRequest) returns (Empty);
  rpc toggleTaskSettled(TaskSettledRequest) returns (Empty);
  rpc forkTaskAt(ForkTaskAtRequest) returns (String);
  rpc interjectPrompt(InterjectPromptRequest) returns (Empty);
  rpc stopSubagent(StopSubagentRequest) returns (Empty);
  // Gets filtered task history
  rpc getTaskHistory(GetTaskHistoryRequest) returns (TaskHistoryArray);
  // Sends a response to a previous ask operation
  rpc askResponse(AskResponseRequest) returns (Empty);
  // Edits a previous user message, truncates following conversation, and regenerates
  rpc editMessageAndRegenerate(EditMessageAndRegenerateRequest) returns (Empty);
  // Records task feedback (thumbs up/down)
  rpc taskFeedback(StringRequest) returns (Empty);
  // Executes a quick win task with command and title
  rpc executeQuickWin(ExecuteQuickWinRequest) returns (Empty);
  // Deletes all task history
  rpc deleteAllTaskHistory(EmptyRequest) returns (DeleteAllTaskHistoryCount);
  // Renames a thread (user-set title; the default stays the first message)
  rpc renameTask(RenameTaskRequest) returns (Empty);
  // Replaces a thread's tags and records auto tags the user dismissed
  rpc setThreadTags(SetThreadTagsRequest) returns (Empty);
  // Builds the vscode:// deep link for a chat message ("Copy link").
  rpc buildMessageLink(BuildMessageLinkRequest) returns (MessageLink);
  // Resolves a message link back to its message (the paste -> quote chip path).
  rpc resolveMessageLink(ResolveMessageLinkRequest) returns (MessageLinkInfo);
  // Opens a linked message: shows its thread scrolled to it (a sent message's tag).
  rpc openMessageLink(ResolveMessageLinkRequest) returns (Empty);
}

// Request message for creating a new task
message NewTaskRequest {
  Metadata metadata = 1;
  string text = 2;
  repeated string images = 3;
  repeated string files = 4;
  optional Settings task_settings = 5;
  // Starts the task without focusing it (home composer "start in background").
  bool run_in_background = 6;
  // Files the new thread into this task group ("Task" in the UI).
  optional string task_group_id = 7;
  optional bool run_in_worktree = 20;
  // Explicit composer actions for this message (see ComposerProvenance).
  ComposerProvenance provenance = 21;
}

// Request message for toggling task favorite status
message TaskFavoriteRequest {
  Metadata metadata = 1;
  string task_id = 2;
  bool is_favorited = 3;
}

message TaskSettledRequest {
  Metadata metadata = 1;
  string task_id = 2;
}

message ForkTaskAtRequest {
  Metadata metadata = 1;
  string task_id = 2;
  int64 message_ts = 3;
}

message InterjectPromptRequest {
  Metadata metadata = 1;
  string text = 2;
  repeated string images = 3;
  repeated string files = 4;
  ComposerProvenance provenance = 5;
}

message StopSubagentRequest {
  Metadata metadata = 1;
  string task_id = 2;
  // ThreadStrip chip id: "<subagent-status-message-ts>:<item index>".
  string subagent_id = 3;
}

// Response for task details
message TaskResponse {
  string id = 1;
  string task = 2;
  int64 ts = 3;
  bool is_favorited = 4;
  int64 size = 5;
  double total_cost = 6;
  int32 tokens_in = 7;
  int32 tokens_out = 8;
  int32 cache_writes = 9;
  int32 cache_reads = 10;
  string model_id = 11;
  bool is_legacy = 12;
  optional bool is_settled = 14;
  optional int64 settled_at = 15;
  optional string parent_task_id = 16;
  optional int64 forked_at_ts = 17;
}

// Request for getting task history with filtering
message GetTaskHistoryRequest {
  Metadata metadata = 1;
  bool favorites_only = 2;
  string search_query = 3;
  string sort_by = 4;
  bool current_workspace_only = 5;
  int32 limit = 6;
  int32 offset = 7;
}

// Response for task history
message TaskHistoryArray {
  repeated TaskItem tasks = 1;
  bool has_more = 2;
}

// Task item details for history list
message TaskItem {
  string id = 1;
  string task = 2;
  int64 ts = 3;
  bool is_favorited = 4;
  int64 size = 5;
  double total_cost = 6;
  int32 tokens_in = 7;
  int32 tokens_out = 8;
  int32 cache_writes = 9;
  int32 cache_reads = 10;
  string model_id = 11;
  bool is_legacy = 12;
  optional bool is_settled = 14;
  optional int64 settled_at = 15;
  optional string parent_task_id = 16;
  optional int64 forked_at_ts = 17;
  // Provider id the task ran on. Empty for tasks recorded before this
  // field existed and for legacy imports; consumers show cost in that case.
  string api_provider = 13;
  // User-set thread title; empty = fall back to `task` (the first message).
  string title = 18;
  // Task group this thread is filed under; empty when unfiled.
  string task_group_id = 19;
}

// Request for ask response operation
message AskResponseRequest {
  Metadata metadata = 1;
  string response_type = 2;
  string text = 3;
  repeated string images = 4;
  repeated string files = 5;
  string decision_id = 6;
  string task_id = 7;
  ComposerProvenance provenance = 8;
}

// Request for editing a past user message and regenerating the conversation after it
message EditMessageAndRegenerateRequest {
  Metadata metadata = 1;
  int64 message_ts = 2;
  string text = 3;
  repeated string images = 4;
  repeated string files = 5;
  bool restore_workspace = 6;
  // Explicit composer actions for this edit (see ComposerProvenance).
  ComposerProvenance provenance = 7;
}

// Request for executing a quick win task
message ExecuteQuickWinRequest {
  Metadata metadata = 1;
  string command = 2;
  string title = 3;
}

// Results returned when deleting all task history
message DeleteAllTaskHistoryCount {
  int32 tasks_deleted = 1;
}

// Request for renaming a thread (user-set title; empty clears it back to the
// first-message default)
message RenameTaskRequest {
  Metadata metadata = 1;
  string task_id = 2;
  string title = 3;
}

// Request for replacing a thread's tags wholesale
message SetThreadTagsRequest {
  Metadata metadata = 1;
  string task_id = 2;
  repeated TaskTag tags = 3;
  // Auto tag values the user removed; prevents re-adding them on later scans.
  repeated string dismissed_auto_tags = 4;
}

// Identifies the rendered row a link is being copied from: the row's
// ClineMessage.ts is minted per render, so the host maps it to the stable
// SDK transcript index before building the link.
message BuildMessageLinkRequest {
  Metadata metadata = 1;
  string thread_id = 2;
  int64 message_ts = 3;
}

message MessageLink {
  string url = 1;
}

// A message deep link's target: thread id + index into the SDK transcript
// (ClineMessage.sdkMessageIndex), which is stable across reloads.
message ResolveMessageLinkRequest {
  Metadata metadata = 1;
  string thread_id = 2;
  int64 message_index = 3;
  // Row anchor within that transcript message: the tool call a completion-tool
  // row came from, or the ordinal of the rendered text row among its siblings.
  // Both absent for links minted before anchors existed.
  optional string tool_call_id = 4;
  optional int32 block = 5;
}

// The message a link points at: its text plus enough attribution for the
// composer's quote chip ("You · Dev plan").
message MessageLinkInfo {
  string thread_id = 1;
  int64 message_index = 2;
  string thread_title = 3;
  // "user" or "assistant" — the chip renders "You" or "Cline".
  string author = 4;
  string text = 5;
}
